<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio | Um espaço para você</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Apoio</h1>

        <button onclick="gerarApoio()">Receber apoio</button>

    </div>

    <script src="script.js"></script>
